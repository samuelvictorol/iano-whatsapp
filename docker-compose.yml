version: "3.9"

services:
  logger:
    build: .
    container_name: iano_whatsapp
    ports:
      - "10000:10000"
    environment:
      # Porta HTTP do backend
      - PORT=10000

      # TTL opcional das mensagens no Mongo (0 = sem expirar)
      - MSG_TTL_DAYS=${MSG_TTL_DAYS:-0}

      # ID da sessão do WhatsApp (só pra diferenciar se quiser rodar múltiplos)
      - WWEBJS_CLIENT_ID=${WWEBJS_CLIENT_ID:-whatsapp-bot}

      # Diretórios de sessão/mídia (batendo com o Dockerfile e whatsapp.js)
      - WWEBJS_STORE=/app/data/wwebjs
      - MEDIA_DIR=/app/data/media

      # Puppeteer/Chromium (você já setou no Dockerfile, mas não faz mal repetir)
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - PUPPETEER_SKIP_DOWNLOAD=true

    volumes:
      # Persiste sessão do WhatsApp e mídias no host
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iano_whatsapp-frontend
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
