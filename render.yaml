services:
  # ==========================
  # 1) BACKEND - WHATSAPP + AI
  # ==========================
  - type: web
    name: iano-whatsapp-backend
    runtime: docker
    env: docker        # importante pra Docker
    plan: free
    region: oregon     # aqui pode ter region, é web docker normal
    dockerfilePath: ./Dockerfile

    # Porta interna do container: teu server.js usa process.env.PORT || 10000
    # O Render vai setar PORT automaticamente, então não precisa mudar o código.
    envVars:
      - key: NODE_ENV
        value: production

      # se quiser, já deixa o token de proteção do painel
      # (ou cria esse env var depois pelo painel do Render)
      - key: DASH_TOKEN
        value: ""

      # TTL opcional de mensagens no Mongo (0 = nunca expira)
      - key: MSG_TTL_DAYS
        value: "0"

      # ID da sessão do WhatsApp (se quiser rodar múltiplas sessões depois)
      - key: WWEBJS_CLIENT_ID
        value: "whatsapp-bot"

    # ⚠️ IMPORTANTE: sem `disks` no free tier!
    # A pasta /app/data (wwebjs + media) vai ficar no filesystem efêmero do container.
    # Isso significa:
    # - Enquanto o serviço não for redeployado, o cache do WhatsApp persiste.
    # - Quando der REDEPLOY, vai precisar escanear o QR de novo (normal pro free).

  # ==========================
  # 2) FRONTEND - QUASAR (SPA)
  # ==========================
  - type: web
    name: iano-whatsapp-frontend
    runtime: static     # site estático
    repoPath: frontend  # porque o projeto Quasar está em ./frontend

    buildCommand: |
      npm install
      npx quasar build

    # Caminho padrão da build SPA do Quasar
    staticPublishPath: dist/spa

    # ❌ NÃO colocar region aqui: static não aceita region.
    # ❌ Também não precisa de plan aqui (static sites já são free por padrão).

    # Se você usar env de build no Quasar (ex.: QUASAR_PUBLIC_API_BASE_URL),
    # pode declarar aqui:
    # envVars:
    #   - key: QUASAR_PUBLIC_API_BASE_URL
    #     value: "https://iano-whatsapp-backend.onrender.com"
