services:
  # ============================
  # BACKEND (Node + WhatsApp)
  # ============================
  - type: web
    name: iano-whatsapp-backend
    env: docker
    plan: free               # aqui pode usar free normalmente
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: "/usr/bin/chromium"

  # ============================
  # FRONTEND (Quasar SPA estático)
  # ============================
  - type: web
    name: iano-whatsapp-frontend
    env: static              # site estático
    # ⚠️ NÃO usar plan aqui (nem region)
    buildCommand: >
      cd frontend &&
      npm install &&
      npm run build
    staticPublishPath: frontend/dist/spa
    # se teu build gera em outro lugar (ex: dist), ajusta esse caminho
