services:
  # ============================
  # BACKEND - IANO WHATSAPP API
  # ============================
  - type: web
    name: iano-whatsapp-api          # nome do serviço no Render
    runtime: docker
    plan: free                       # pode trocar depois se quiser
    region: oregon                   # ou frankfurt, etc.

    # Repo: se você omitir, o Render usa o repo onde está o render.yaml
    # repo: https://github.com/seu-user/iano-whatsapp.git

    # Dockerfile está na raiz do projeto
    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: PORT
        value: 10000

      # TTL das mensagens no Mongo (0 = não expira)
      - key: MSG_TTL_DAYS
        value: "0"

      # ID da sessão do WhatsApp (pra diferenciar se um dia tiver multi-instância)
      - key: WWEBJS_CLIENT_ID
        value: whatsapp-bot

      # Diretórios de sessão / mídia (batendo com Dockerfile + whatsapp.js)
      - key: WWEBJS_STORE
        value: /app/data/wwebjs

      - key: MEDIA_DIR
        value: /app/data/media

      # Chromium já instalado no Dockerfile
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium

      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"

      # Opcional: token pra proteger painel/rotas (x-token)
      # - key: DASH_TOKEN
      #   sync: false  # você preenche no painel do Render

    # Disco persistente pra não perder sessão do WhatsApp nem mídias
    disk:
      name: whatsapp-data
      mountPath: /app/data
      sizeGB: 1         # aumenta se começar a salvar muita mídia

  # ============================
  # FRONTEND - QUASAR (SPA)
  # ============================
  - type: web
    name: iano-whatsapp-frontend
    runtime: static
    plan: free
    region: oregon

    # Build de produção do Quasar
    # (assumindo que o projeto está na pasta ./frontend)
    buildCommand: >
      cd frontend &&
      npm install &&
      npx quasar build -m spa

    # Caminho onde o Quasar gera os arquivos estáticos (relativo à raiz do repo)
    staticPublishPath: frontend/dist/spa

    # Regras de rota pra SPA (todas as rotas > index.html)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Variáveis de ambiente do frontend (ajuste pro que você usa no código)
    envVars:
      - key: VITE_API_BASE_URL
        value: https://iano-whatsapp-api.onrender.com
        # ou a URL real que o Render gerar pro serviço de backend
